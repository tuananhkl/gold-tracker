apiVersion: apps/v1
kind: Deployment
metadata:
  name: gold-tracker-api
spec:
  replicas: 1
  selector: { matchLabels: { app: gold-tracker-api } }
  template:
    metadata:
      labels: { app: gold-tracker-api }
    spec:
      containers:
        - name: api
          image: gold-tracker-api:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ConnectionStrings__Postgres
              value: "Host=postgres;Port=5432;Database=gold;Username=gold;Password=gold"
            - name: POSTGRES_CONN
              value: "Host=postgres;Port=5432;Database=gold;Username=gold;Password=gold"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Docker"
            - name: SCRAPER_ENABLED
              value: "false"
            - name: SNAPSHOT_ENABLED
              value: "false"
            - name: ALERTS_ENABLED
              value: "true"
            - name: TELEGRAM_ENABLED
              value: "true"
            - name: Alerts__Enabled
              value: "true"
            - name: Alerts__PriceJumpPercent
              value: "2.0"
            - name: Alerts__NoDataMinutes
              value: "20"
            - name: Alerts__Timezone
              value: "Asia/Ho_Chi_Minh"
            - name: Telegram__Enabled
              value: "true"
            - name: Elasticsearch__Enabled
              value: "true"
            - name: Elasticsearch__BaseUrl
              value: "https://192.168.31.156:9200"
            - name: Elasticsearch__IndexLogs
              value: "gold-tracker-api-application-*"
          envFrom:
            - configMapRef: { name: gold-app-config }
            - secretRef: { name: telegram-secret }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10

